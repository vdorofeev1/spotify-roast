spring:
  application:
    name: backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          spotify:
            client-id: ${SPOTIFY_CLIENT_ID:}
            client-secret: ${SPOTIFY_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - user-read-private
              - user-read-email
              - user-top-read
              - user-read-recently-played
        provider:
          spotify:
            authorization-uri: https://accounts.spotify.com/authorize
            token-uri: https://accounts.spotify.com/api/token
            user-info-uri: https://api.spotify.com/v1/me
            user-name-attribute: id

springdoc:
  swagger-ui:
    path: /swagger-ui.html

encryption:
  key: ${ENCRYPTION_KEY:}

rate-limit:
  roast:
    cooldown-seconds: 30   # minimum gap between /api/roast calls per user
  spotify:
    window-seconds: 60     # sliding window duration for /api/me/* endpoints
    max-calls: 20          # max calls per user within that window

gemini:
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:gemini-1.5-flash}

frontend:
  url: ${FRONTEND_URL:}

server:
  port: 8080
  forward-headers-strategy: framework
