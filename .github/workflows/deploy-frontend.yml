name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  deploy:
    name: Build & deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        working-directory: frontend
        run: |
          gcloud run deploy pet-project-frontend \
            --source . \
            --region=us-central1 \
            --project=project-47c8781e-43f8-4b91-ad1 \
            --cpu-boost \
            --memory=512Mi \
            --set-env-vars="APP_BASE_URL=https://pet-project-192775393109.us-central1.run.app,BACKEND_URL=https://pet-project-192775393109.us-central1.run.app,VITE_BACKEND_URL=https://pet-project-192775393109.us-central1.run.app" \
            --allow-unauthenticated

      - name: Verify deployment
        run: |
          gcloud run services describe pet-project-frontend \
            --region=us-central1 \
            --project=project-47c8781e-43f8-4b91-ad1 \
            --format='value(status.conditions[0].status)'