services:
  frontend:
    build:
      context: ./frontend
    environment:
      PORT: 3000
      BACKEND_URL: ${VITE_BACKEND_URL:-http://host.docker.internal:8080}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spotifyroast
      POSTGRES_USER: roast
      POSTGRES_PASSWORD: roast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roast"]
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
